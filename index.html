<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ranking de jugadores</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


</head>

<body>

  <main class="container">

    <h1> Ranking of Player</h1>

    <form id="playerForm" novalidate>

      <input id="playerName" type="text" placeholder="Enter the name ">

      <input id="playerScore" type="number" placeholder="Enter the punctuation">

      <button type="submit">
        Add / update
      </button>

    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <h2>Classification</h2>
    <ul id="ranking"></ul>

  </main>

  <script src="main.js">  </script>

</body>

</html>
